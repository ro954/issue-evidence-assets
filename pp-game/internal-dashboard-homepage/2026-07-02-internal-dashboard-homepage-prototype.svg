  <text class="tiny" x="424" y="752">06-27</text>
  <text class="tiny" x="514" y="752">06-28</text>
  <text class="tiny" x="604" y="752">06-29</text>
  <text class="tiny" x="694" y="752">06-30</text>
  <text class="tiny" x="784" y="752">07-01</text>
  <text class="tiny" x="874" y="752">07-02</text>
  <circle class="blue" cx="332" cy="776" r="5"/><text class="tiny" x="344" y="782">投注额</text>
  <circle class="green" cx="424" cy="776" r="5"/><text class="tiny" x="436" y="782">派奖额</text>
  <circle class="amber" cx="520" cy="776" r="5"/><text class="tiny" x="532" y="782">平台输赢</text>

  <rect class="panel shadow" x="982" y="438" width="298" height="356" rx="8"/>
  <circle class="callout" cx="1008" cy="464" r="17"/><text class="callout-text" x="1008" y="464">5</text>
  <text class="label" x="1042" y="472">异常与状态提示</text>
  <rect x="1012" y="508" width="232" height="62" rx="6" class="soft-amber"/>
  <text class="tiny" x="1030" y="532">RTP 偏高商户 2 个</text>
  <text class="tiny" x="1030" y="554">点击查看商户报表</text>
  <rect x="1012" y="588" width="232" height="62" rx="6" class="soft-red"/>
  <text class="tiny" x="1030" y="612">今日无数据商户 5 个</text>
  <text class="tiny" x="1030" y="634">确认是否暂停或未接入</text>
  <rect x="1012" y="668" width="232" height="62" rx="6" class="soft-green"/>
  <text class="tiny" x="1030" y="692">汇总任务正常</text>
  <text class="tiny" x="1030" y="714">最近刷新 15:35</text>
  <text class="tiny" x="1012" y="762">一期可先做状态/空数据提示；</text>
  <text class="tiny" x="1012" y="784">复杂告警规则后续拆分。</text>

  <rect class="panel shadow" x="260" y="822" width="1020" height="226" rx="8"/>
  <circle class="callout" cx="286" cy="848" r="17"/><text class="callout-text" x="286" y="848">4</text>
  <text class="label" x="320" y="856">分商户概览</text>
  <text class="tiny" x="320" y="884">默认按投注额降序；查看详情跳转 #206 商户报表并带入筛选。</text>
  <rect class="table-head" x="290" y="902" width="960" height="38"/>
  <text class="tiny" x="310" y="926">商户</text>
  <text class="tiny" x="470" y="926">币种</text>
  <text class="tiny" x="550" y="926">投注额</text>
  <text class="tiny" x="690" y="926">派奖额</text>
  <text class="tiny" x="830" y="926">平台输赢</text>
  <text class="tiny" x="970" y="926">活跃玩家</text>
  <text class="tiny" x="1100" y="926">操作</text>
  <line class="table-line" x1="290" y1="940" x2="1250" y2="940"/>
  <text class="tiny" x="310" y="972">Demo Merchant A</text>
  <text class="tiny" x="470" y="972">THB</text>
  <text class="tiny" x="550" y="972">5,820,000</text>
  <text class="tiny" x="690" y="972">5,430,400</text>
  <text class="green" font-size="15" x="830" y="972">389,600</text>
  <text class="tiny" x="970" y="972">1,426</text>
  <text class="blue" font-size="15" x="1100" y="972">查看详情</text>
  <line class="table-line" x1="290" y1="990" x2="1250" y2="990"/>
  <text class="tiny" x="310" y="1022">Demo Merchant B</text>
  <text class="tiny" x="470" y="1022">THB</text>
  <text class="tiny" x="550" y="1022">3,150,450</text>
  <text class="tiny" x="690" y="1022">3,246,800</text>
  <text class="red" font-size="15" x="830" y="1022">-96,350</text>
  <text class="tiny" x="970" y="1022">904</text>
  <text class="blue" font-size="15" x="1100" y="1022">查看详情</text>

  <rect class="panel shadow" x="1304" y="550" width="246" height="498" rx="8"/>
  <circle class="callout" cx="1330" cy="576" r="17"/><text class="callout-text" x="1330" y="576">6</text>
  <text class="label" x="1364" y="584">快捷入口</text>
  <rect x="1330" y="620" width="188" height="42" rx="6" class="soft-blue"/>
  <text class="label" x="1352" y="647">盈亏报表</text>
  <rect x="1330" y="678" width="188" height="42" rx="6" class="soft-blue"/>
  <text class="label" x="1352" y="705">商户报表</text>
  <rect x="1330" y="736" width="188" height="42" rx="6" class="soft-blue"/>
  <text class="label" x="1352" y="763">游戏报表</text>
  <rect x="1330" y="794" width="188" height="42" rx="6" class="soft-blue"/>
  <text class="label" x="1352" y="821">玩家报表</text>
  <rect x="1330" y="872" width="188" height="92" rx="6" fill="#f8fafc" stroke="#d7dce5"/>
  <text class="tiny" x="1348" y="900">商户账号只显示本商户；</text>
  <text class="tiny" x="1348" y="922">不可通过 URL/接口越权；</text>
  <text class="tiny" x="1348" y="944">无权限模块隐藏或提示。</text>
</svg>
