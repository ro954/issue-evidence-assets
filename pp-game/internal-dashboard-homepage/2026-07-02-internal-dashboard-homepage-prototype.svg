  <line class="axis" x1="320" y1="650" x2="910" y2="650"/>
  <line class="axis" x1="320" y1="584" x2="910" y2="584"/>
  <line class="axis" x1="320" y1="518" x2="910" y2="518"/>
  <polyline class="blue-line" points="330,686 420,642 510,662 600,592 690,552 780,586 890,514"/>
  <polyline class="green-line" points="330,704 420,678 510,690 600,644 690,604 780,628 890,586"/>
  <polyline points="330,706 420,692 510,710 600,672 690,650 780,664 890,622" stroke="#d97706" stroke-width="4" fill="none"/>
  <circle class="blue" cx="890" cy="514" r="6"/>
  <circle class="green" cx="890" cy="586" r="6"/>
  <circle class="amber" cx="890" cy="622" r="6"/>
