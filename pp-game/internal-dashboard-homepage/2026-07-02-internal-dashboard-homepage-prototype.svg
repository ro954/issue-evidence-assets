<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .bg { fill: #f3f5f8; }
      .sidebar { fill: #172033; }
      .topbar, .panel, .card { fill: #ffffff; }
      .muted { fill: #6b7280; font-size: 18px; }
      .tiny { fill: #64748b; font-size: 15px; }
      .label { fill: #334155; font-size: 17px; font-weight: 600; }
      .title { fill: #111827; font-size: 30px; font-weight: 700; }
      .side-title { fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .side-text { fill: #cbd5e1; font-size: 18px; }
      .nav-active { fill: #2563eb; }
      .nav { fill: #293449; }
      .line { stroke: #d7dce5; stroke-width: 1.5; fill: none; }
      .axis { stroke: #e5e7eb; stroke-width: 1.2; }
      .blue { fill: #2563eb; }
      .blue-line { stroke: #2563eb; stroke-width: 4; fill: none; }
      .green { fill: #059669; }
      .green-line { stroke: #059669; stroke-width: 4; fill: none; }
      .red { fill: #dc2626; }
      .amber { fill: #d97706; }
      .soft-blue { fill: #eff6ff; }
      .soft-green { fill: #ecfdf5; }
      .soft-red { fill: #fef2f2; }
      .soft-amber { fill: #fffbeb; }
      .shadow { filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.08)); }
      .callout { fill: #f97316; }
      .callout-text { fill: white; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .mono { fill: #0f172a; font-size: 26px; font-weight: 700; }
      .table-head { fill: #f8fafc; }
      .table-line { stroke: #e5e7eb; stroke-width: 1; }
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1120"/>

  <rect class="sidebar" x="0" y="0" width="226" height="1120"/>
  <text class="side-title" x="28" y="48">PPLive 后台</text>
  <text class="side-text" x="28" y="84">内部运营中心</text>
  <rect class="nav-active" x="18" y="130" width="190" height="48" rx="6"/>
  <text fill="#ffffff" font-size="18" font-weight="700" x="48" y="161">仪表盘首页</text>
  <rect class="nav" x="18" y="192" width="190" height="44" rx="6"/>
  <text class="side-text" x="48" y="220">运营报表</text>
  <rect class="nav" x="18" y="248" width="190" height="44" rx="6"/>
  <text class="side-text" x="48" y="276">注单记录</text>
  <rect class="nav" x="18" y="304" width="190" height="44" rx="6"/>
  <text class="side-text" x="48" y="332">商户管理</text>
  <rect class="nav" x="18" y="360" width="190" height="44" rx="6"/>
  <text class="side-text" x="48" y="388">玩家列表</text>

  <rect class="topbar shadow" x="226" y="0" width="1374" height="72"/>
  <text class="muted" x="256" y="44">首页 / 运营仪表盘</text>
  <rect x="1300" y="20" width="240" height="32" rx="16" fill="#eef2ff"/>
  <text class="label" x="1324" y="42">数据更新时间 15:35</text>

  <text class="title" x="260" y="120">运营仪表盘 / 首页</text>
  <text class="muted" x="260" y="150">用于快速查看今日经营、每日趋势、分商户表现；详细核对跳转 #206 运营报表。</text>

  <rect class="panel shadow" x="260" y="176" width="1020" height="92" rx="8"/>
  <circle class="callout" cx="286" cy="198" r="17"/><text class="callout-text" x="286" y="198">1</text>
  <text class="label" x="320" y="207">筛选口径</text>
  <rect x="320" y="224" width="160" height="30" rx="5" fill="#f8fafc" stroke="#d7dce5"/>
  <text class="tiny" x="336" y="244">今日 2026-07-02</text>
  <rect x="492" y="224" width="142" height="30" rx="5" fill="#f8fafc" stroke="#d7dce5"/>
  <text class="tiny" x="508" y="244">币种：THB</text>
  <rect x="646" y="224" width="170" height="30" rx="5" fill="#f8fafc" stroke="#d7dce5"/>
  <text class="tiny" x="662" y="244">商户：全部商户</text>
  <rect x="828" y="224" width="154" height="30" rx="5" fill="#f8fafc" stroke="#d7dce5"/>
  <text class="tiny" x="844" y="244">游戏：全部</text>
  <rect x="998" y="224" width="92" height="30" rx="5" fill="#2563eb"/>
  <text fill="#ffffff" font-size="15" font-weight="700" x="1022" y="244">查询</text>
  <rect x="1102" y="224" width="96" height="30" rx="5" fill="#f8fafc" stroke="#d7dce5"/>
  <text class="tiny" x="1123" y="244">重置</text>

  <rect class="panel shadow" x="1304" y="176" width="246" height="348" rx="8"/>
  <text class="label" x="1330" y="212">标注说明</text>
  <text class="tiny" x="1330" y="246">1 筛选条件与 #206 同口径</text>
  <text class="tiny" x="1330" y="278">2 今日核心汇总与环比</text>
  <text class="tiny" x="1330" y="310">3 每日趋势，默认近 7/30 天</text>
  <text class="tiny" x="1330" y="342">4 分商户排行与下钻</text>
  <text class="tiny" x="1330" y="374">5 异常/状态提示</text>
  <text class="tiny" x="1330" y="406">6 高频报表入口</text>
  <rect x="1330" y="436" width="190" height="52" rx="6" class="soft-amber"/>
  <text class="tiny" x="1344" y="458">多币种金额不得混算；</text>
  <text class="tiny" x="1344" y="480">需筛选或按币种分组。</text>

  <g>
    <circle class="callout" cx="286" cy="306" r="17"/><text class="callout-text" x="286" y="306">2</text>
    <rect class="card shadow" x="260" y="294" width="238" height="116" rx="8"/>
    <text class="muted" x="288" y="328">总投注额</text>
    <text class="mono" x="288" y="366">12,680,450.00</text>
    <text class="green" font-size="16" font-weight="700" x="288" y="394">较昨日 +8.4%</text>

    <rect class="card shadow" x="520" y="294" width="238" height="116" rx="8"/>
    <text class="muted" x="548" y="328">总派奖额</text>
    <text class="mono" x="548" y="366">11,928,770.00</text>
    <text class="red" font-size="16" font-weight="700" x="548" y="394">较昨日 +11.2%</text>

    <rect class="card shadow" x="780" y="294" width="238" height="116" rx="8"/>
    <text class="muted" x="808" y="328">平台输赢</text>
    <text class="mono" x="808" y="366">751,680.00</text>
    <text class="green" font-size="16" font-weight="700" x="808" y="394">平台赢为正</text>

    <rect class="card shadow" x="1040" y="294" width="238" height="116" rx="8"/>
    <text class="muted" x="1068" y="328">RTP / 活跃玩家</text>
    <text class="mono" x="1068" y="366">94.07% / 3,482</text>
    <text class="tiny" x="1068" y="394">按结算时间统计</text>
  </g>

  <rect class="panel shadow" x="260" y="438" width="700" height="356" rx="8"/>
  <circle class="callout" cx="286" cy="464" r="17"/><text class="callout-text" x="286" y="464">3</text>
