<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d3557" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5478d4"/>
    </marker>
    <style>
      .title { font-family: "PingFang SC", sans-serif; font-size: 42px; font-weight: 700; fill: #18233a; }
      .subtitle { font-family: "PingFang SC", sans-serif; font-size: 22px; font-weight: 400; fill: #61708c; }
      .box-title { font-family: "PingFang SC", sans-serif; font-size: 26px; font-weight: 700; fill: #1f2d4d; }
      .box-text { font-family: "PingFang SC", sans-serif; font-size: 20px; font-weight: 400; fill: #485979; }
      .badge { font-family: "PingFang SC", sans-serif; font-size: 22px; font-weight: 700; fill: white; }
      .note-title { font-family: "PingFang SC", sans-serif; font-size: 22px; font-weight: 700; fill: #263958; }
      .note { font-family: "PingFang SC", sans-serif; font-size: 18px; font-weight: 400; fill: #54657f; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f2f5fb"/>
  <text x="100" y="88" class="title">TG 定期数据播报流程示意</text>
  <text x="100" y="126" class="subtitle">固定周期汇总平台重要经营与运行数据；具体指标清单在设计阶段确认</text>

  <g filter="url(#shadow)">
    <rect x="80" y="210" width="310" height="300" rx="28" fill="#ffffff" stroke="#d9e3f5" stroke-width="2"/>
    <circle cx="120" cy="250" r="23" fill="#5274d8"/>
    <text x="113" y="258" class="badge">1</text>
    <text x="155" y="260" class="box-title">数据来源</text>
    <text x="120" y="320" class="box-text">• 经营汇总</text>
    <text x="120" y="360" class="box-text">• 玩家 / 注单活跃</text>
    <text x="120" y="400" class="box-text">• 商户 / 游戏表现</text>
    <text x="120" y="440" class="box-text">• 运行状态与异常</text>
    <text x="120" y="482" class="note">复用后台报表口径</text>
  </g>

  <line x1="410" y1="360" x2="485" y2="360" stroke="#5478d4" stroke-width="5"/>
  <polygon points="500,360 482,349 482,371" fill="#5478d4"/>

  <g filter="url(#shadow)">
    <rect x="520" y="210" width="310" height="300" rx="28" fill="#ffffff" stroke="#d9e3f5" stroke-width="2"/>
    <circle cx="560" cy="250" r="23" fill="#7b61d1"/>
    <text x="553" y="258" class="badge">2</text>
    <text x="595" y="260" class="box-title">周期汇总</text>
    <text x="560" y="320" class="box-text">• 播报周期 / 时间</text>
    <text x="560" y="360" class="box-text">• 时区与统计区间</text>
    <text x="560" y="400" class="box-text">• 币种分组 / 换算</text>
    <text x="560" y="440" class="box-text">• 环比与异常摘要</text>
    <text x="560" y="482" class="note">缺失数据不得当成 0</text>
  </g>

  <line x1="850" y1="360" x2="925" y2="360" stroke="#5478d4" stroke-width="5"/>
  <polygon points="940,360 922,349 922,371" fill="#5478d4"/>

  <g filter="url(#shadow)">
    <rect x="960" y="210" width="310" height="300" rx="28" fill="#ffffff" stroke="#d9e3f5" stroke-width="2"/>
    <circle cx="1000" cy="250" r="23" fill="#1f9d8a"/>
    <text x="993" y="258" class="badge">3</text>
    <text x="1035" y="260" class="box-title">TG 播报</text>
    <text x="1000" y="320" class="box-text">• 目标群 / 频道</text>
    <text x="1000" y="360" class="box-text">• 摘要模板</text>
    <text x="1000" y="400" class="box-text">• 重点变化高亮</text>
    <text x="1000" y="440" class="box-text">• 查看详情入口</text>
    <text x="1000" y="482" class="note">与即时告警分开</text>
  </g>

  <line x1="1290" y1="360" x2="1365" y2="360" stroke="#5478d4" stroke-width="5"/>
  <polygon points="1380,360 1362,349 1362,371" fill="#5478d4"/>

  <g filter="url(#shadow)">
    <rect x="1400" y="210" width="120" height="300" rx="28" fill="#ffffff" stroke="#d9e3f5" stroke-width="2"/>
    <circle cx="1440" cy="250" r="23" fill="#e18445"/>
    <text x="1433" y="258" class="badge">4</text>
    <text x="1426" y="312" class="box-title">留痕</text>
    <text x="1424" y="360" class="box-text">成功</text>
    <text x="1424" y="400" class="box-text">失败</text>
    <text x="1424" y="440" class="box-text">重试</text>
    <text x="1424" y="480" class="box-text">防重</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="590" width="1440" height="220" rx="28" fill="#ffffff" stroke="#d9e3f5" stroke-width="2"/>
    <text x="120" y="645" class="note-title">一期边界</text>
    <text x="120" y="690" class="note">做：可配置周期、目标 TG、播报模板、数据口径、发送记录、失败重试与防重复。</text>
    <text x="120" y="730" class="note">不做：商户公告内容管理、机台状态即时告警、自动调整机台状态、PP / EVO 游戏前端改动。</text>
    <text x="120" y="770" class="note">设计阶段确认：首批指标、播报频率、目标群、币种展示方式、是否需要跳转后台详情。</text>
  </g>

  <text x="1260" y="860" class="subtitle">低保真流程示意 · 2026-07-23</text>
</svg>
